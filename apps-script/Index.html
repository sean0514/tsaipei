<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國際實習生管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#523F4D; --ink-soft:#9C8399; --paper:#FDF3F7; --panel:#FFFFFF;
    --line:#F3D9E5; --line-soft:#FAEAF1;
    --jade:#EA82A3; --jade-dark:#C85D82; --jade-tint:#FDE7EE;
    --amber:#E8A87C; --amber-tint:#FCEEE0;
    --green:#7BC4A4; --green-tint:#E5F5EE;
    --red:#E8828C; --red-tint:#FCE7E9;
    --blue:#A79BD1; --blue-tint:#F0ECFA;
    --sidebar-bg:#5A3A56;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);display:flex;min-height:100vh;font-size:14px;}
  h1,h2,h3{font-family:'Noto Serif TC',serif;margin:0;color:var(--jade-dark);}

  #sidebar{width:220px;flex-shrink:0;background:var(--sidebar-bg);color:#F3E3ED;display:flex;flex-direction:column;padding:22px 0;}
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:14px;}
  .brand-mark{font-family:'Noto Serif TC',serif;font-weight:700;font-size:18px;color:#fff;line-height:1.4;}
  .brand-sub{font-size:11.5px;color:#D6AFC7;margin-top:4px;}
  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:#E3C2D6;cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;width:100%;}
  .nav-group-label{display:flex;align-items:center;gap:10px;padding:10px 12px 2px 12px;color:#C79BB8;font-size:11.5px;font-weight:700;letter-spacing:.03em;}
  .nav-subitem{padding-left:30px;}
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:var(--jade);color:#fff;}
  .nav-icon{width:16px;text-align:center;flex-shrink:0;opacity:.9;}
  .sidebar-foot{margin-top:auto;padding:14px 20px 0 20px;border-top:1px solid rgba(255,255,255,0.15);font-size:11px;color:#C79BB8;line-height:1.6;}

  #main{flex:1;min-width:0;padding:32px 40px 60px 40px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:22px;color:var(--ink);}
  .page-desc{color:var(--ink-soft);font-size:13px;margin-top:6px;}
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:var(--radius);border:1px solid var(--jade);background:var(--jade);color:#fff;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--jade-dark);border-color:var(--jade-dark);}
  .btn.secondary{background:transparent;color:var(--jade);}
  .btn.secondary:hover{background:var(--jade-tint);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.ghost{border-color:var(--line);color:var(--ink-soft);background:transparent;}
  .btn.ghost:hover{background:var(--line-soft);}
  .btn.danger-ghost{border-color:var(--line);color:var(--red);background:transparent;}
  .btn.danger-ghost:hover{background:var(--red-tint);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}

  .stat-row{display:flex;gap:14px;margin-bottom:26px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat-num{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:700;color:var(--ink);}
  .stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .dash-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  @media (max-width:900px){.dash-cols{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .panel h3{font-size:15px;margin-bottom:14px;}
  .empty-note{color:var(--ink-soft);font-size:12.5px;padding:10px 0;}
  .alert-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .alert-row:last-child{border-bottom:none;}
  .alert-name{font-weight:600;}
  .alert-sub{color:var(--ink-soft);font-size:12px;margin-top:1px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .cell-sub{color:var(--ink-soft);font-size:11.5px;margin-top:2px;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .tag-jade{background:var(--jade-tint);color:var(--jade-dark);}
  .tag-amber{background:var(--amber-tint);color:#8A5219;}
  .tag-green{background:var(--green-tint);color:var(--green);}
  .tag-red{background:var(--red-tint);color:var(--red);}
  .tag-blue{background:var(--blue-tint);color:var(--blue);}
  .tag-grey{background:var(--line-soft);color:var(--ink-soft);}
  button.tag{border:none;cursor:pointer;font-family:inherit;transition:filter .15s;}
  button.tag:hover{filter:brightness(0.93);}

  select,input[type=text],input[type=date],input[type=month],input[type=email],input[type=number],input[type=password],textarea{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  select:focus,input:focus,textarea:focus{outline:2px solid var(--jade-tint);border-color:var(--jade);}

  .overlay{position:fixed;inset:0;background:rgba(20,26,32,0.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:24px 26px 22px 26px;box-shadow:0 12px 40px rgba(90,58,86,0.18);}
  .modal h2{font-size:17px;margin-bottom:4px;}
  .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  textarea{resize:vertical;min-height:60px;font-family:inherit;}
  .form-error{background:var(--red-tint);color:var(--red);font-size:12.5px;padding:8px 10px;border-radius:var(--radius);margin-bottom:12px;}

  .searchable-select{position:relative;}
  .searchable-select input[type=text]{width:100%;}
  .searchable-select-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(90,58,86,0.18);
  }
  .searchable-select-item{padding:9px 12px;font-size:13px;cursor:pointer;}
  .searchable-select-item:hover{background:var(--jade-tint);}
  .searchable-select-empty{padding:9px 12px;font-size:12.5px;color:var(--ink-soft);}

  .status-chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .status-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink-soft);user-select:none;}
  .status-chip input{margin:0;accent-color:var(--jade);}
  .status-chip.is-checked{background:var(--jade-tint);border-color:var(--jade);color:var(--jade-dark);font-weight:600;}
  .doc-chip{transition:background .15s;}
  .doc-chip:hover{background:var(--line-soft);}
  .doc-chip.is-checked:hover{background:var(--jade-tint);}
  .doc-chip-del{margin-left:7px;opacity:.55;font-size:11px;}
  .doc-chip-del:hover{opacity:1;color:var(--red);}
  .doc-chip-edit{margin-left:6px;opacity:.55;font-size:11px;}
  .doc-chip-edit:hover{opacity:1;color:var(--jade-dark);}
  .progress-row{padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .progress-row:last-child{border-bottom:none;}

  .pipeline{display:flex;align-items:center;gap:0;margin:4px 0 2px 0;flex-wrap:wrap;}
  .pip-step{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--line-soft);color:var(--ink-soft);font-weight:600;}
  .pip-step.done{background:var(--jade);color:#fff;}
  .pip-sep{width:12px;height:1px;background:var(--line);}

  .section-gap{margin-top:30px;}
  .subhead{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;}
  .split-note{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .loading-note{color:var(--ink-soft);font-size:13px;padding:30px 0;}

  /* Login screen */
  #login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#5A3A56,#8A5B82 55%,#EA82A3);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .login-card{background:#fff;border-radius:22px;width:100%;max-width:380px;padding:32px 30px;box-shadow:0 20px 60px rgba(90,58,86,0.35);}
  .login-card h1{font-size:19px;margin-bottom:4px;}
  .login-card .modal-sub{margin-bottom:20px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card" id="login-card"></div>
</div>

<div id="sidebar" style="display:none;">
  <div class="brand">
    <div class="brand-mark">🌸 鈞羽有限公司<br>境外實習生管理系統</div>
    <div class="brand-sub">International Internship Desk</div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-foot" id="sidebar-foot"></div>
</div>

<div id="main" style="display:none;">
  <div id="loading" class="loading-note">資料載入中…</div>
  <div id="page-root" style="display:none;"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal-body"></div>
</div>

<script>
/* =========================================================
   Server call helper (Promise 包裝 google.script.run)
========================================================= */
function gsRun(fnName){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(err){ reject(err); })[fnName].apply(null, args);
  });
}

/* =========================================================
   Auth / session
========================================================= */
var authToken = sessionStorage.getItem('internSysToken') || null;
var currentUser = null; // {id,name,role}

function setAuth(token, user){
  authToken = token;
  currentUser = user;
  if(token) sessionStorage.setItem('internSysToken', token);
  else sessionStorage.removeItem('internSysToken');
}

async function bootAuth(){
  if(authToken){
    try{
      currentUser = await gsRun('whoAmI', authToken);
      startApp();
      return;
    }catch(e){
      setAuth(null, null);
    }
  }
  var initialized = await gsRun('isSystemInitialized');
  if(!initialized){
    renderSetupScreen();
  } else {
    renderLoginScreen();
  }
}

function renderLoginScreen(errorMsg){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-card').innerHTML =
    '<h1>🌸 境外實習生管理系統</h1>' +
    '<div class="modal-sub">請輸入帳號密碼登入</div>' +
    (errorMsg ? '<div class="form-error">' + errorMsg + '</div>' : '') +
    '<form id="login-form">' +
      '<div class="field"><label>帳號</label><input type="text" name="username" required autofocus></div>' +
      '<div class="field"><label>密碼</label><input type="password" name="password" required></div>' +
      '<button type="submit" class="btn" style="width:100%;">登入</button>' +
    '</form>';
  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var data = formToObject(e.target);
    var submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = '登入中…';
    try{
      var res = await gsRun('login', data.username, data.password);
      setAuth(res.token, {id:res.id, name:res.name, role:res.role});
      startApp();
    }catch(err){
      renderLoginScreen(errMsg(err));
    }
  });
}

function renderSetupScreen(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-card').innerHTML =
    '<h1>建立第一位系統使用者</h1>' +
    '<div class="modal-sub">系統尚未建立任何使用者，請先建立管理員帳號（將自動設為「系統管理員」角色）</div>' +
    '<form id="setup-form">' +
      '<div class="field"><label>姓名</label><input type="text" name="name" required></div>' +
      '<div class="field"><label>帳號</label><input type="text" name="username" required></div>' +
      '<div class="field"><label>密碼（至少 6 碼）</label><input type="password" name="password" required minlength="6"></div>' +
      '<button type="submit" class="btn" style="width:100%;">建立並登入</button>' +
    '</form>';
  document.getElementById('setup-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var data = formToObject(e.target);
    var submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = '建立中…';
    try{
      var res = await gsRun('setupFirstAdmin', data.name, data.username, data.password);
      setAuth(res.token, {id:res.id, name:res.name, role:res.role});
      startApp();
    }catch(err){
      submitBtn.disabled = false; submitBtn.textContent = '建立並登入';
      alert(errMsg(err));
    }
  });
}

function errMsg(err){
  if(!err) return '發生未知錯誤。';
  return err.message || String(err);
}

async function doLogout(){
  try{ await gsRun('logout', authToken); }catch(e){}
  setAuth(null, null);
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  renderLoginScreen();
}

function startApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('main').style.display = 'block';
  loadAll();
}

/* =========================================================
   State
========================================================= */
let state = { students:[], positions:[], matches:[], secondInterviews:[], admittedList:[], applicationProgress:[], inTaiwanVisaRecords:[], inTaiwanCareRecords:[], internshipDocs:[], housingRecords:[], meetings:[], bonuses:[], clientBillingRecords:[], clientFeeSetupRecords:[], internalFeeSetupRecords:[], users:[], roleMatrix:null };
let permissions = {};
let currentPage = 'dashboard';

async function loadAll(){
  document.getElementById('loading').style.display = 'block';
  document.getElementById('page-root').style.display = 'none';
  try{
    const data = await gsRun('getAllData', authToken);
    state.students = data.students;
    state.positions = data.positions;
    state.matches = data.matches;
    state.secondInterviews = data.secondInterviews;
    state.admittedList = data.admittedList;
    state.applicationProgress = data.applicationProgress;
    state.inTaiwanVisaRecords = data.inTaiwanVisaRecords;
    state.inTaiwanCareRecords = data.inTaiwanCareRecords;
    state.internshipDocs = data.internshipDocs;
    state.housingRecords = data.housingRecords;
    state.meetings = data.meetings;
    state.bonuses = data.bonuses;
    state.clientBillingRecords = data.clientBillingRecords;
    state.clientFeeSetupRecords = data.clientFeeSetupRecords;
    state.internalFeeSetupRecords = data.internalFeeSetupRecords;
    state.users = data.users;
    state.roleMatrix = data.roleMatrix;
    permissions = data.permissions;
    currentUser = data.currentUser;
  }catch(err){
    document.getElementById('loading').textContent = '資料載入失敗：' + errMsg(err);
    return;
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('page-root').style.display = 'block';
  renderSidebarIdentity();
  render();
}

function canEdit(moduleKey){ return permissions[moduleKey] === 'edit'; }
function canView(moduleKey){ return permissions[moduleKey] && permissions[moduleKey] !== 'none'; }

/* =========================================================
   Lookups
========================================================= */
function studentById(id){ return state.students.find(s=>s.id===id); }
function positionById(id){ return state.positions.find(p=>p.id===id); }
function positionVenuesText(p){
  if(!p) return '';
  const groups = parseLocationGroups(p.locationGroups);
  const venues = Array.from(new Set(groups.map(g=>g.venue).filter(Boolean)));
  return venues.join('、');
}
function positionCompanyLabel(p){
  if(!p) return '';
  const parts = [];
  if(p.projectCode) parts.push(p.projectCode);
  parts.push(p.company);
  const venues = positionVenuesText(p);
  if(venues) parts.push(venues);
  return parts.join(' ');
}
function matchPositionLabel(m){
  if(!m) return '';
  const p = positionById(m.positionId);
  if(!p) return m.positionId ? '(職缺已刪除)' : '尚未指定職缺';
  const parts = [];
  if(p.projectCode) parts.push(p.projectCode);
  parts.push(p.company);
  if(m.venue) parts.push(m.venue);
  else {
    const venues = positionVenuesText(p);
    if(venues) parts.push(venues);
  }
  return parts.join(' ');
}
function studentFullLabel(s){
  if(!s) return '(已刪除)';
  if(s.chineseName && s.originalName) return `${s.chineseName}（${s.originalName}）`;
  return s.chineseName || s.originalName || '(未命名)';
}

/* =========================================================
   Nav / identity
========================================================= */
const NAV_STRUCTURE = [
  {type:'item', page:'dashboard', label:'儀表板', icon:'◆'},
  {type:'item', page:'students', label:'學生資料', icon:'◇'},
  {type:'group', label:'職缺媒合', moduleKey:'matching', items:[
    {page:'positions', label:'實習單位', icon:'⌘'},
    {page:'matches', label:'媒合紀錄', icon:'⇄'},
    {page:'secondInterview', label:'二面進度', icon:'◐'},
    {page:'admitted', label:'錄取名單', icon:'✓'}
  ]},
  {type:'item', page:'internshipDocs', label:'實習文件追蹤', icon:'▥'},
  {type:'item', page:'applicationProgress', label:'申辦進度追蹤', icon:'▶'},
  {type:'group', label:'實習在台追蹤', moduleKey:'inTaiwanTracking', items:[
    {page:'inTaiwanVisa', label:'在台簽證追蹤', icon:'✈'},
    {page:'inTaiwanCare', label:'在台關懷紀錄', icon:'♡'}
  ]},
  {type:'item', page:'managerReport', label:'主管報表', icon:'▲'},
  {type:'item', page:'housing', label:'住宿安排', icon:'⌂'},
  {type:'item', page:'meetings', label:'會議記錄', icon:'✎'},
  {type:'group', label:'會計專用', moduleKey:'bonus', items:[
    {page:'clientBilling', label:'客戶請款計算', icon:'⌗'},
    {page:'studentSelfPayHousing', label:'學生自付宿舍', icon:'⌂'},
    {page:'studentMasterSheet', label:'學生資料總檔', icon:'▥'}
  ]},
  {type:'group', label:'資料建檔', moduleKey:'users', items:[
    {page:'users', label:'使用人員', icon:'▣'},
    {page:'clientFeeSetup', label:'客戶費用建檔', icon:'▦'},
    {page:'internalFeeSetup', label:'內部費用建檔', icon:'▧'},
    {page:'bonus', label:'內部獎金計算', icon:'◈'}
  ]}
];

function pageModuleKey(page){
  if(page==='positions' || page==='matches' || page==='secondInterview' || page==='admitted') return 'matching';
  if(page==='inTaiwanVisa' || page==='inTaiwanCare') return 'inTaiwanTracking';
  if(page==='clientBilling' || page==='clientFeeSetup' || page==='internalFeeSetup' || page==='studentSelfPayHousing' || page==='studentMasterSheet') return 'bonus';
  return page;
}

function firstViewablePage(){
  for(const entry of NAV_STRUCTURE){
    if(entry.type==='item' && canView(entry.page)) return entry.page;
    if(entry.type==='group'){
      const firstVisible = entry.items.find(sub=>canView(pageModuleKey(sub.page)));
      if(firstVisible) return firstVisible.page;
    }
  }
  return 'dashboard';
}

document.getElementById('nav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-item');
  if(!btn) return;
  currentPage = btn.dataset.page;
  render();
});

function renderNav(){
  const nav = document.getElementById('nav');
  const parts = [];
  NAV_STRUCTURE.forEach(entry=>{
    if(entry.type==='item'){
      if(!canView(entry.page)) return;
      parts.push(`<button class="nav-item ${currentPage===entry.page?'active':''}" data-page="${entry.page}"><span class="nav-icon">${entry.icon}</span>${entry.label}</button>`);
    } else if(entry.type==='group'){
      const visibleItems = entry.items.filter(sub=>canView(pageModuleKey(sub.page)));
      if(!visibleItems.length) return;
      parts.push(`<div class="nav-group-label">${entry.label}</div>`);
      visibleItems.forEach(sub=>{
        parts.push(`<button class="nav-item nav-subitem ${currentPage===sub.page?'active':''}" data-page="${sub.page}"><span class="nav-icon">${sub.icon}</span>${sub.label}</button>`);
      });
    }
  });
  nav.innerHTML = parts.join('');
}

function renderSidebarIdentity(){
  const el = document.getElementById('sidebar-foot');

/* =========================================================
   Status tag helpers
========================================================= */
const STUDENT_STATUS = ['媒合中','待面試','已面試','送審中','補件中','企業用印','收到函文','辦理簽證中','已入台實習','已完成','取消'];
const STUDENT_TAG = {
  '媒合中':'tag-blue','待面試':'tag-blue','已面試':'tag-blue',
  '送審中':'tag-amber','補件中':'tag-amber','企業用印':'tag-amber','辦理簽證中':'tag-amber',
  '收到函文':'tag-jade','已入台實習':'tag-green','已完成':'tag-grey','取消':'tag-red'
};
const POSITION_STATUS = ['開放中','已額滿','已結束'];
const POSITION_TAG = {'開放中':'tag-green','已額滿':'tag-amber','已結束':'tag-grey'};
function parseLocationGroups(json){
  try{
    const arr = json ? JSON.parse(json) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
const MATCH_STATUS = ['媒合中','已媒合','取消'];
const MATCH_TAG = {'媒合中':'tag-amber','已媒合':'tag-green','取消':'tag-red'};
const ROLES = ['系統管理員','主管','業務人員','服務人員','翻譯人員','國外供應','行政人員','會計人員','宿管人員'];

function tag(text, map){
  const cls = (map && map[text]) || 'tag-grey';
  return `<span class="tag ${cls}">${text}</span>`;
}

/* =========================================================
   DASHBOARD
========================================================= */
function effectiveEntryDate(s){ return s.secondEntryDate || s.firstEntryDate || ''; }
function effectiveExitDate(s){ return s.secondExitDate || s.firstExitDate || ''; }

function renderDashboard(){
  const total = state.students.length;
  const active = state.students.filter(s=>s.status==='已入台實習').length;
  const matching = state.students.filter(s=>['媒合中','待面試','已面試'].includes(s.status)).length;
  const openPositions = state.positions.filter(p=>parseLocationGroups(p.locationGroups).some(g=>g.status==='開放中')).length;
  const unarrangedHousing = state.housingRecords.filter(h=>!h.checkIn && h.completed!=='是');

  const upcomingEnd = state.students
    .filter(s=>effectiveExitDate(s))
    .slice()
    .sort((a,b)=>effectiveExitDate(a).localeCompare(effectiveExitDate(b)))
    .slice(0,6);

  const recentEntries = state.students
    .filter(s=>effectiveEntryDate(s))
    .slice()
    .sort((a,b)=>effectiveEntryDate(b).localeCompare(effectiveEntryDate(a)))
    .slice(0,6);

  const needsCare = state.inTaiwanCareRecords
    .filter(c=>c.status==='待關心' && c.confirmedDeparture!=='是')
    .slice(0,6);

  const pendingDocsMap = {};
  state.internshipDocs.forEach(d=>{
    if(d.status!=='已核准' && d.status!=='不適用'){
      pendingDocsMap[d.studentId] = (pendingDocsMap[d.studentId]||0) + 1;
    }
  });
  const pendingDocsList = Object.keys(pendingDocsMap)
    .map(sid=>({student: studentById(sid), count: pendingDocsMap[sid]}))
    .filter(x=>x.student)
    .sort((a,b)=>b.count-a.count)
    .slice(0,6);

  return `
    <div class="page-head">
      <div><h1>儀表板</h1><div class="page-desc">國際實習生整體狀況總覽</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">學生總數</div></div>
      <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">已入台實習</div></div>
      <div class="stat-card"><div class="stat-num">${matching}</div><div class="stat-label">媒合/面試處理中</div></div>
      <div class="stat-card"><div class="stat-num">${openPositions}</div><div class="stat-label">開放中職缺</div></div>
      <div class="stat-card"><div class="stat-num">${unarrangedHousing.length}</div><div class="stat-label">宿舍待安排學生</div></div>
    </div>
    <div class="dash-cols">
      <div class="panel">
        <h3>近期入境學生</h3>
        ${recentEntries.length ? recentEntries.map(s=>{
          return `<div class="alert-row"><div>
            <div class="alert-name">${studentFullLabel(s)}</div>
            <div class="alert-sub">入境日：${effectiveEntryDate(s)}</div>
          </div>${tag(s.status, STUDENT_TAG)}</div>`;
        }).join('') : `<div class="empty-note">尚無設定入境日期的學生。</div>`}
      </div>
      <div class="panel">
        <h3>近期實習到期學生</h3>
        ${upcomingEnd.length ? upcomingEnd.map(s=>{
          return `<div class="alert-row"><div>
            <div class="alert-name">${studentFullLabel(s)}</div>
            <div class="alert-sub">離境日：${effectiveExitDate(s)}</div>
          </div>${tag(s.status, STUDENT_TAG)}</div>`;
        }).join('') : `<div class="empty-note">尚無設定離境日期的學生。</div>`}
      </div>
    </div>
    <div class="dash-cols">
      <div class="panel">
        <h3>待關心學生</h3>
        ${needsCare.length ? needsCare.map(c=>{
          const st = studentById(c.studentId);
          return `<div class="alert-row"><div>
            <div class="alert-name">${studentFullLabel(st)}</div>
            <div class="alert-sub">${c.careDate?('上次關懷：'+c.careDate):'尚未有關懷紀錄日期'}</div>
          </div>${tag(c.status, CARE_TAG)}</div>`;
        }).join('') : `<div class="empty-note">目前沒有標記為「待關心」的學生。</div>`}
      </div>
      <div class="panel">
        <h3>待補件學生（實習文件追蹤）</h3>
        ${pendingDocsList.length ? pendingDocsList.map(x=>{
          return `<div class="alert-row"><div>
            <div class="alert-name">${studentFullLabel(x.student)}</div>
            <div class="alert-sub">${studentPositionLabel(x.student.id)}</div>
          </div><span class="tag tag-amber">尚缺 ${x.count} 項</span></div>`;
        }).join('') : `<div class="empty-note">目前沒有待補件的學生。</div>`}
      </div>
    </div>
  `;
}

/* =========================================================
   MANAGER REPORT (主管報表)
========================================================= */
let managerReportMonth = '';

function renderManagerReport(){
  if(!managerReportMonth) managerReportMonth = currentMonthStr();
  const canSeeFinance = canView('bonus');

  const statusCounts = {};
  state.students.forEach(s=>{
    const key = s.status || '未設定';
    statusCounts[key] = (statusCounts[key]||0) + 1;
  });
  const statusOrder = ['媒合中','待面試','已面試','送審中','補件中','企業用印','收到函文','辦理簽證中','已入台實習','已完成','取消'];
  const statusRows = statusOrder.filter(k=>statusCounts[k]).map(k=>({label:k, count:statusCounts[k]}))
    .concat(Object.keys(statusCounts).filter(k=>!statusOrder.includes(k)).map(k=>({label:k, count:statusCounts[k]})));

  const nationalityCounts = {};
  state.students.forEach(s=>{
    const key = s.nationality || '未設定';
    nationalityCounts[key] = (nationalityCounts[key]||0) + 1;
  });
  const nationalityRows = Object.keys(nationalityCounts).sort((a,b)=>nationalityCounts[b]-nationalityCounts[a]).map(k=>({label:k, count:nationalityCounts[k]}));

  const clientCounts = {};
  state.students.forEach(s=>{
    const pair = studentProjectClientPair(s.id);
    if(!pair || !pair.client) return;
    clientCounts[pair.client] = (clientCounts[pair.client]||0) + 1;
  });
  const topClients = Object.keys(clientCounts).sort((a,b)=>clientCounts[b]-clientCounts[a]).slice(0,8).map(k=>({label:k, count:clientCounts[k]}));

  const unarrangedHousing = state.housingRecords.filter(h=>!h.checkIn && h.completed!=='是').length;
  const activeHousing = state.housingRecords.filter(h=>h.checkIn && (!h.checkOut || h.checkOut >= new Date().toISOString().slice(0,10)) && h.completed!=='是').length;
  const departedHousing = state.housingRecords.filter(h=>h.checkOut && h.checkOut < new Date().toISOString().slice(0,10) && h.completed!=='是').length;

  const docStudentIds = new Set(state.internshipDocs.map(d=>d.studentId));
  let docsComplete = 0, docsPending = 0;
  docStudentIds.forEach(sid=>{
    const items = state.internshipDocs.filter(d=>d.studentId===sid);
    const allDone = items.every(d=>d.status==='已核准' || d.status==='不適用');
    if(allDone) docsComplete++; else docsPending++;
  });

  let bonusTotal = 0, billingTotal = 0;
  if(canSeeFinance){
    computeInternalBonusForMonth(managerReportMonth).forEach(r=>{
      BONUS_ROLE_KEYS.forEach(k=>{ bonusTotal += r.amounts[k]||0; });
    });
    computeClientBillingForMonth(managerReportMonth).forEach(r=>{ billingTotal += r.total||0; });
  }

  const barRow = (label, count, max)=>{
    const pct = max ? Math.round(count/max*100) : 0;
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>${label}</span><span style="font-weight:600;">${count}</span>
      </div>
      <div style="background:var(--line-soft);border-radius:6px;height:8px;overflow:hidden;">
        <div style="background:var(--jade,#7BAE8F);width:${pct}%;height:100%;"></div>
      </div>
    </div>`;
  };
  const maxStatus = Math.max(1, ...statusRows.map(r=>r.count));
  const maxNationality = Math.max(1, ...nationalityRows.map(r=>r.count));
  const maxClient = Math.max(1, ...topClients.map(r=>r.count));

  return `
    <div class="page-head">
      <div><h1>主管報表</h1><div class="page-desc">跨模組彙整的整體營運數據總覽</div></div>
    </div>
    ${canSeeFinance ? `
    <div class="toolbar">
      <input type="month" id="manager-report-month" value="${managerReportMonth}">
      <span class="split-note" style="margin:0;">財務數據依此月份試算</span>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num">${bonusTotal.toLocaleString()}</div><div class="stat-label">本月內部獎金試算</div></div>
      <div class="stat-card"><div class="stat-num">${billingTotal.toLocaleString()}</div><div class="stat-label">本月客戶請款試算</div></div>
      <div class="stat-card"><div class="stat-num">${docsComplete}</div><div class="stat-label">文件已齊全學生</div></div>
      <div class="stat-card"><div class="stat-num">${docsPending}</div><div class="stat-label">文件待補件學生</div></div>
    </div>
    ` : ''}
    <div class="dash-cols">
      <div class="panel">
        <h3>學生狀態分佈</h3>
        ${statusRows.length ? statusRows.map(r=>barRow(r.label, r.count, maxStatus)).join('') : `<div class="empty-note">尚無學生資料。</div>`}
      </div>
      <div class="panel">
        <h3>住宿狀態分佈</h3>
        ${barRow('未安排', unarrangedHousing, Math.max(1, unarrangedHousing, activeHousing, departedHousing))}
        ${barRow('住宿中', activeHousing, Math.max(1, unarrangedHousing, activeHousing, departedHousing))}
        ${barRow('已離宿', departedHousing, Math.max(1, unarrangedHousing, activeHousing, departedHousing))}
      </div>
    </div>
    <div class="dash-cols">
      <div class="panel">
        <h3>國籍分佈</h3>
        ${nationalityRows.length ? nationalityRows.map(r=>barRow(r.label, r.count, maxNationality)).join('') : `<div class="empty-note">尚無學生資料。</div>`}
      </div>
      <div class="panel">
        <h3>學生人數前 8 大客戶</h3>
        ${topClients.length ? topClients.map(r=>barRow(r.label, r.count, maxClient)).join('') : `<div class="empty-note">尚無媒合資料。</div>`}
      </div>
    </div>
  `;
}

  {key:'sourceSupplier',label:'學生來源(國外供應商)'}
];

function docChecklist(s){
  return [
    s.langProofStatus==='已收到',
    s.enrollProofStatus==='已收到',
    s.passportCopy==='已收到',
    s.extensionNeeded==='無' || s.extensionProof==='已收到',
    s.nightInternshipDoc==='已收到' || s.nightInternshipDoc==='不適用'
  ];
}
function docSummary(s){
  const list = docChecklist(s);
  const done = list.filter(Boolean).length;
  return { done, total:list.length, complete: done===list.length };
}

function renderStudents(){

  {key:'otherBenefits',label:'其他福利'},{key:'specialNotes',label:'特殊備註'},
  {key:'bizDev',label:'開發業務'},{key:'serviceSupervisor',label:'服務主管'},{key:'serviceSpecialist',label:'服務專員'},
  {key:'translationSupervisor',label:'翻譯主管'},{key:'translationSpecialist',label:'翻譯專員'},

  {key:'accountant',label:'會計人員'},{key:'accountantAssistant',label:'會計助理'},
  {key:'dormManager1',label:'宿管人員1'},{key:'dormManager2',label:'宿管人員2'}
];
function renderPositions(){
  const editable = canEdit('matching');
  const industryMap = {};
  const posRows = state.positions.map(p=>{
    const groups = parseLocationGroups(p.locationGroups);
    const totalHeadcount = groups.reduce((sum,g)=>sum+(Number(g.headcount)||0),0);
    const matchCount = state.matches.filter(m=>m.positionId===p.id && m.status!=='取消').length;
    const industryKey = p.industry || '未分類';
    if(!industryMap[industryKey]) industryMap[industryKey] = {positions:0, total:0, matched:0};
    industryMap[industryKey].positions += 1;
    industryMap[industryKey].total += totalHeadcount;
    industryMap[industryKey].matched += matchCount;
    const groupsHTML = groups.length ? groups.map(g=>
      `<div style="margin-bottom:4px;">${g.venue?g.venue+' · ':''}${g.location||'—'} · ${g.headcount||0}名 ${tag(g.status, POSITION_TAG)}</div>`
    ).join('') : `<span class="cell-sub">尚未設定地點</span>`;
    return `<tr>
      <td>${p.projectCode||'—'}</td>
      <td><div style="font-weight:600;">${p.company}</div><div class="cell-sub">${p.industry||''}</div></td>
      <td>${p.title}</td>
      <td>${groupsHTML}</td>
      <td>${matchCount} / ${totalHeadcount||'—'}</td>
      <td>${editable ? `<div class="row-actions">
        <button class="btn small ghost" data-edit-position="${p.id}">編輯</button>
        <button class="btn small danger-ghost" data-del-position="${p.id}">刪除</button>
      </div>` : ''}</td>
    </tr>`;
  }).join('');

  const industryKeys = Object.keys(industryMap).sort((a,b)=>industryMap[b].total-industryMap[a].total);
  const industryRows = industryKeys.map(k=>{
    const info = industryMap[k];
    const remaining = Math.max(0, info.total - info.matched);
    return `<tr>
      <td style="font-weight:600;">${k}</td>
      <td>${info.positions}</td>
      <td>${info.total}</td>
      <td>${info.matched}</td>
      <td>${remaining}</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head">
      <div><h1>實習單位</h1><div class="page-desc">管理合作企業釋出的實習職缺${editable?'':'（唯讀）'}</div></div>
      ${editable ? '<button class="btn" id="btn-add-position">+ 新增職缺</button>' : ''}
      ${importExportButtonsHTML('position', editable)}
    </div>
    ${editable ? `<div class="split-note" style="margin-top:-14px;margin-bottom:16px;">「匯入資料」需使用「下載完整資料」產生的 CSV 檔案編輯；上傳後會完全取代目前所有職缺資料，請先下載備份再匯入。</div>` : ''}
    <div class="panel">
      <h3>缺額概況（依產業分類）</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>產業別</th><th>職缺數</th><th>總缺額</th><th>已媒合</th><th>剩餘缺額</th></tr></thead>
        <tbody>${industryRows || `<tr><td colspan="5"><div class="empty-note">尚無職缺資料。</div></td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="panel section-gap"><div class="table-wrap"><table>
      <thead><tr><th>專案編號</th><th>公司 / 產業</th><th>職務名稱</th><th>地點 / 缺額 / 狀態</th><th>已媒合 / 總缺額</th><th></th></tr></thead>
      <tbody>${posRows || `<tr><td colspan="6"><div class="empty-note">尚無職缺，點選「新增職缺」開始建立。</div></td></tr>`}</tbody>
    </table></div></div>

  });

  function matchRowHTML(m){

function studentMatchOptionLabel(s){

function rebuildMatchPositionOptions(preserveId){
  const projSel = document.getElementById('match-project-select');
  const compSel = document.getElementById('match-company-select');
  const posSel = document.getElementById('match-position-select');
  if(!posSel) return;
  const proj = projSel ? projSel.value : '';
  const comp = compSel ? compSel.value : '';
  const currentVal = preserveId !== undefined ? preserveId : posSel.value;
  const filtered = state.positions.filter(p => {
    if(proj && p.projectCode !== proj) return false;
    if(comp && p.company !== comp) return false;
    return true;
  });
  posSel.innerHTML = '<option value="">請選擇職務</option>' +
    filtered.map(p=>`<option value="${p.id}" ${p.id===currentVal?'selected':''}>${p.title}${comp?'':'（'+p.company+'）'}</option>`).join('');
}
function rebuildMatchVenueOptions(preserveVenue){
  const posSel = document.getElementById('match-position-select');
  const venueSel = document.getElementById('match-venue-select');
  if(!posSel || !venueSel) return;
  const posId = posSel.value;
  const p = posId ? positionById(posId) : null;
  const venues = p ? Array.from(new Set(parseLocationGroups(p.locationGroups).map(g=>g.venue).filter(Boolean))).sort() : [];
  const currentVal = preserveVenue !== undefined ? preserveVenue : venueSel.value;
  const keep = venues.includes(currentVal) ? currentVal : (venues.length===1 ? venues[0] : '');
  const placeholder = posId ? (venues.length ? '請選擇實習場域' : '（此職缺未設定場域）') : '請先選擇職務';
  venueSel.innerHTML = `<option value="">${placeholder}</option>` +
    venues.map(v=>`<option value="${v}" ${v===keep?'selected':''}>${v}</option>`).join('');
}
function wireMatchFilters(existing){
  const natSel = document.getElementById('match-nationality-select');
  const schSel = document.getElementById('match-school-select');
  const projSel = document.getElementById('match-project-select');
  const compSel = document.getElementById('match-company-select');
  const posSel = document.getElementById('match-position-select');
  const studentSel = document.getElementById('match-student-select');
  rebuildMatchStudentOptions(existing ? existing.studentId : '');
  rebuildMatchPositionOptions(existing ? existing.positionId : '');
  rebuildMatchVenueOptions(existing ? existing.venue : '');
  if(natSel) natSel.addEventListener('change', ()=>rebuildMatchStudentOptions(''));
  if(schSel) schSel.addEventListener('change', ()=>rebuildMatchStudentOptions(''));
  if(projSel) projSel.addEventListener('change', ()=>rebuildMatchPositionOptions());
  if(compSel) compSel.addEventListener('change', ()=>{
    if(compSel.value && projSel){
      const matchingProjects = Array.from(new Set(
        state.positions.filter(p=>p.company===compSel.value).map(p=>p.projectCode).filter(Boolean)
      ));
      if(matchingProjects.length === 1) projSel.value = matchingProjects[0];
    }
    rebuildMatchPositionOptions();
  });
  if(posSel) posSel.addEventListener('change', ()=>rebuildMatchVenueOptions(''));
  if(studentSel) studentSel.addEventListener('change', ()=>{
    const s = studentById(studentSel.value);
    if(s){
      if(natSel) natSel.value = s.nationality || '';
      if(schSel) schSel.value = s.school || '';
    }
  });
  const statusSel = document.getElementById('match-status-select');
  const dateInput = document.getElementById('match-date-input');
  if(statusSel && dateInput){
    statusSel.addEventListener('change', ()=>{
      if(statusSel.value === '已媒合' && !dateInput.value){
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth()+1).padStart(2,'0');
        const dd = String(today.getDate()).padStart(2,'0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }
    });
  }
}

function wireMatchPicker(prefix){
  const search = document.getElementById(prefix+'-match-search');
  const hidden = document.getElementById(prefix+'-match-value');
  const list = document.getElementById(prefix+'-match-list');
  if(!search || !hidden || !list) return;

  function renderList(filterText){
    const ft = (filterText||'').trim().toLowerCase();
    const filtered = state.matches.filter(m=>!ft || matchFullLabel(m).toLowerCase().includes(ft));
    list.innerHTML = filtered.length
      ? filtered.map(m=>`<div class="searchable-select-item" data-id="${m.id}">${matchFullLabel(m)}</div>`).join('')
      : `<div class="searchable-select-empty">找不到符合的媒合紀錄</div>`;
    list.style.display = 'block';
  }

  search.addEventListener('focus', ()=> renderList(search.value));
  search.addEventListener('input', ()=>{
    hidden.value = '';
    renderList(search.value);
  });
  search.addEventListener('blur', ()=>{
    setTimeout(()=>{ list.style.display = 'none'; }, 150);
  });
  list.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.searchable-select-item');
    if(!item) return;
    const m = matchById(item.dataset.id);
    hidden.value = item.dataset.id;
    search.value = m ? matchFullLabel(m) : '';
    list.style.display = 'none';
  });
}

const PROGRESS_STAGES = [
  '學生錄取','MOU簽署-學校端用印','MOU簽署-企業端用印','收集學生資料','收集企業資料',

];

function progressPipelineHTML(stage){
  const idx = PROGRESS_STAGES.indexOf(stage);
  return `<div class="pipeline">${PROGRESS_STAGES.map((step,i)=>{
    const done = idx>=0 && i<=idx;
    return `<span class="pip-step ${done?'done':''}">${step}</span>` + (i<PROGRESS_STAGES.length-1?'<span class="pip-sep"></span>':'');
  }).join('')}</div>`;
}

let progressSearchQuery = '';

function studentCompanyName(studentId){
  const admitted = state.admittedList.find(a=>{
    const m = matchById(a.matchId);
    return m && m.studentId === studentId;
  });
  let m = admitted ? matchById(admitted.matchId) : null;
  if(!m) m = state.matches.find(x=>x.studentId===studentId);
  if(!m) return '未指定客戶';
  return matchPositionLabel(m) || '未指定客戶';
}

function groupByProjectCompany(list){

    byStudent[d.studentId].push(d);
  });
  const query = internshipDocsSearchQuery.trim().toLowerCase();
  let studentIds = Object.keys(byStudent).sort((a,b)=>{
    return studentFullLabel(studentById(a)).localeCompare(studentFullLabel(studentById(b)));
  });
  if(query){
    studentIds = studentIds.filter(sid=>{
      const text = `${studentFullLabel(studentById(sid))} ${studentPositionLabel(sid)}`.toLowerCase();
      return text.includes(query);
    });
  }

  const inProgress = [];
  const completed = [];
  studentIds.forEach(sid=>{
    const docs = byStudent[sid];
    const allApproved = docs.length>0 && docs.every(d=>d.status==='已核准');
    (allApproved ? completed : inProgress).push(sid);
  });

  function submittedText(docs){
    const names = docs.filter(d=>d.status!=='未提供').map(d=>d.docType);
    return names.length ? names.join('、') : '（尚未繳交）';
  }
  function overallStatusTag(docs){
    const total = docs.length;
    const collected = docs.filter(d=>d.status!=='未提供').length;
    if(collected===0) return `<span class="tag tag-grey">尚未開始</span>`;
    if(collected<total) return `<span class="tag tag-amber">收集中 ${collected}/${total}</span>`;
    return `<span class="tag tag-blue">已收齊，待確認完成</span>`;
  }
  function completionDate(docs){
    const dates = docs.map(d=>d.receivedDate).filter(Boolean).sort();
    return dates.length ? dates[dates.length-1] : '—';
  }

  const inProgressRows = inProgress.map(sid=>{
    const docs = byStudent[sid];
    return `<tr>
      <td style="font-weight:600;">${studentFullLabel(studentById(sid))}<div class="cell-sub">${studentPositionLabel(sid)}</div></td>
      <td>${submittedText(docs)}</td>
      <td>${overallStatusTag(docs)}</td>
      <td>${editable ? `<div class="row-actions">
        <button class="btn small ghost" data-manage-doc="${sid}">管理</button>
        <button class="btn small danger-ghost" data-del-doc-student="${sid}">刪除</button>
      </div>` : ''}</td>
    </tr>`;
  }).join('');

  const completedRows = completed.map(sid=>{
    const docs = byStudent[sid];
    return `<tr>
      <td style="font-weight:600;">${studentFullLabel(studentById(sid))}<div class="cell-sub">${studentPositionLabel(sid)}</div></td>
      <td>${submittedText(docs)}</td>
      <td>${completionDate(docs)}</td>
      <td><span class="tag tag-green">已完成</span></td>
      <td>${editable ? `<div class="row-actions">
        <button class="btn small ghost" data-manage-doc="${sid}">管理</button>
        <button class="btn small danger-ghost" data-del-doc-student="${sid}">刪除</button>
      </div>` : ''}</td>
    </tr>`;
  }).join('');

  return `
    <div class="page-head">
      <div><h1>實習文件追蹤</h1><div class="page-desc">追蹤每位學生的實習相關文件收件狀況（學生確認錄取後會自動加入此清單）${editable?'':'（唯讀）'}</div></div>
      ${editable ? '<button class="btn" id="btn-add-doc">+ 新增文件紀錄</button>' : ''}
      ${importExportButtonsHTML('doc', editable)}
    </div>
    ${editable ? `<div class="split-note" style="margin-top:-14px;margin-bottom:16px;">「匯入資料」需使用「下載完整資料」產生的 CSV 檔案編輯（保留「學生ID」欄位）；上傳後會完全取代目前所有文件追蹤資料，請先下載備份再匯入。</div>` : ''}
    <div class="toolbar">
      <input type="text" id="doc-search" placeholder="搜尋學生或職缺…" value="${internshipDocsSearchQuery}" style="min-width:260px;">
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>學生 / 職缺</th><th>繳交文件</th><th>狀態</th><th></th></tr></thead>
      <tbody>${inProgressRows || `<tr><td colspan="4"><div class="empty-note">${query?'沒有符合搜尋條件的紀錄。':'尚無追蹤中的文件紀錄。學生「確認錄取」後會自動建立文件清單，也可以點選「新增文件紀錄」手動加入。'}</div></td></tr>`}</tbody>
    </table></div></div>

    <div class="section-gap">
      <h3 class="subhead" style="font-size:16px;">已完成繳交名單</h3>
      <div class="panel"><div class="table-wrap"><table>
        <thead><tr><th>學生 / 職缺</th><th>繳交文件</th><th>完成日期</th><th>狀態</th><th></th></tr></thead>
        <tbody>${completedRows || `<tr><td colspan="5"><div class="empty-note">${query?'沒有符合搜尋條件的紀錄。':'目前沒有已完成的學生。'}</div></td></tr>`}</tbody>
      </table></div></div>
    </div>
  `;
}

function docChecklistModalHTML(studentId){
  const docs = state.internshipDocs.filter(d=>d.studentId===studentId)
    .slice().sort((a,b)=>INTERNSHIP_DOC_TYPES.indexOf(a.docType)-INTERNSHIP_DOC_TYPES.indexOf(b.docType));
  const allCollected = docs.length>0 && docs.every(d=>d.status!=='未提供');
  const chipsHTML = docs.map(d=>{
    const checked = d.status !== '未提供';
    const extraStatus = (checked && d.status!=='已收到') ? ` <span style="opacity:.7;">(${d.status})</span>` : '';
    const extensionNote = (d.docType==='延畢證明' && d.extensionApplicable) ? ` <span style="opacity:.7;">［${d.extensionApplicable}］</span>` : '';
    return `<span class="doc-chip status-chip ${checked?'is-checked':''}" data-toggle-doc="${d.id}" style="cursor:pointer;">
      ${d.docType}${extraStatus}${extensionNote}
      <span class="doc-chip-edit" data-edit-doc="${d.id}" title="詳細編輯">✎</span><span class="doc-chip-del" data-del-doc="${d.id}" title="刪除">✕</span>
    </span>`;
  }).join('');
  return `

    <div class="modal-sub">點選項目切換已收到／未交齊</div>
    <div class="status-chip-group">${chipsHTML || '<span class="empty-note">尚無文件項目。</span>'}</div>
    ${allCollected ? `<div style="margin-top:16px;"><button type="button" class="btn small" data-confirm-complete="${studentId}">✓ 全部文件已收齊，確認完成</button></div>` : ''}
    <div class="modal-actions" style="margin-top:20px;">
      <button type="button" class="btn ghost" id="modal-cancel">關閉</button>
    </div>
  `;
}

async function refreshDocChecklistModal(studentId){
  document.getElementById('modal-body').innerHTML = docChecklistModalHTML(studentId);
  wireDocChecklistModal(studentId);
}

function wireDocChecklistModal(studentId){
  const container = document.getElementById('modal-body');
  container.querySelectorAll('[data-toggle-doc]').forEach(chip=>{
    chip.addEventListener('click', async (e)=>{
      if(e.target.closest('.doc-chip-del') || e.target.closest('.doc-chip-edit')) return;
      const id = chip.dataset.toggleDoc;
      const d = state.internshipDocs.find(x=>x.id===id);
      if(!d) return;
      const today = new Date().toISOString().slice(0,10);
      const payload = d.status === '未提供' ? {status:'已收到', receivedDate: today} : {status:'未提供', receivedDate:''};
      try{ await gsRun('updateInternshipDoc', authToken, id, payload); await loadAll(); await refreshDocChecklistModal(studentId); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  container.querySelectorAll('[data-edit-doc]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const d = state.internshipDocs.find(x=>x.id===b.dataset.editDoc);
      openModal(internshipDocFormModal(d));
      wireStudentInfoDisplay('doc');
      wireDocTypeExtensionToggle();
      document.getElementById('doc-form').addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const form = ev.target; setFormBusy(form, true);
        try{ await gsRun('updateInternshipDoc', authToken, d.id, formToObject(form)); closeModal(); await loadAll(); }
        catch(err){ setFormBusy(form,false); alert(errMsg(err)); }
      });
    });
  });
  container.querySelectorAll('[data-del-doc]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('確定要刪除這筆文件紀錄嗎？')) return;
      try{ await gsRun('deleteInternshipDoc', authToken, b.dataset.delDoc); await loadAll(); await refreshDocChecklistModal(studentId); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  container.querySelectorAll('[data-confirm-complete]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('確定要將這位學生的所有文件標記為「已核准」完成嗎？')) return;
      try{ await gsRun('confirmAllDocsForStudent', authToken, b.dataset.confirmComplete); await loadAll(); closeModal(); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  const cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
}

function wireDocTypeExtensionToggle(){
  const typeSel = document.getElementById('doc-type-select');

    if(langField) langField.style.display = (typeSel.value === '語言能力證明') ? '' : 'none';

}

/* =========================================================
   BONUS CALCULATION
========================================================= */
const BONUS_ROLE_KEYS = ['bizDev','serviceSupervisor','serviceSpecialist','translationSupervisor','translationSpecialist','adminSupervisor','adminSpecialist','accountant','accountantAssistant','dormManager1','dormManager2'];
const BONUS_ROLE_LABELS = ['開發業務','服務主管','服務專員','翻譯主管','翻譯專員','行政主管','行政專員','會計人員','會計助理','宿管人員1','宿管人員2'];

function currentMonthStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthRange(monthStr){
  const parts = (monthStr||'').split('-').map(Number);
  const y = parts[0], m = parts[1];
  if(!y || !m) return null;
  const start = new Date(y, m-1, 1);
  const end = new Date(y, m, 0);
  const daysInMonth = end.getDate();
  return {start, end, daysInMonth};
}
function dateOverlapDays(rangeStart, rangeEnd, entryStr, exitStr){
  if(!entryStr) return 0;
  const entry = new Date(entryStr+'T00:00:00');
  if(isNaN(entry.getTime())) return 0;
  const exit = exitStr ? new Date(exitStr+'T00:00:00') : rangeEnd;
  const s = entry < rangeStart ? rangeStart : entry;
  const e = exit > rangeEnd ? rangeEnd : exit;
  if(e < s) return 0;
  return Math.round((e-s)/(1000*60*60*24)) + 1;
}
function studentDaysInTaiwanForMonth(studentId, monthStr){
  const range = monthRange(monthStr);
  if(!range) return 0;
  const v = state.inTaiwanVisaRecords.find(x=>x.studentId===studentId);
  if(!v) return 0;
  let days = 0;
  days += dateOverlapDays(range.start, range.end, v.firstEntryDate, v.firstExitDate);
  days += dateOverlapDays(range.start, range.end, v.secondEntryDate, v.secondExitDate);
  return days;
}
function studentProjectClientPair(studentId){
  const admitted = state.admittedList.find(a=>{ const m=matchById(a.matchId); return m && m.studentId===studentId; });
  let m = admitted ? matchById(admitted.matchId) : null;
  if(!m) m = state.matches.find(x=>x.studentId===studentId);
  if(!m) return null;
  const p = positionById(m.positionId);
  if(!p || !p.company) return null;
  return {projectCode: p.projectCode||'', client: p.company};
}
function rolesForProjectClient(projectCode, client){
  const positions = state.positions.filter(p => (p.projectCode||'')===projectCode && p.company===client);
  const roles = {};
  BONUS_ROLE_KEYS.forEach(k=>{
    const names = Array.from(new Set(positions.map(p=>p[k]).filter(Boolean)));
    roles[k] = names.join('、');
  });
  return roles;
}
function buildMonthlyProjectClientDayTotals(monthStr){
  const groups = {};
  state.students.forEach(s=>{
    const pair = studentProjectClientPair(s.id);
    if(!pair) return;
    const days = studentDaysInTaiwanForMonth(s.id, monthStr);
    if(days<=0) return;
    const key = pair.projectCode+'||'+pair.client;
    if(!groups[key]) groups[key] = {projectCode:pair.projectCode, client:pair.client, totalDays:0};
    groups[key].totalDays += days;
  });
  return groups;
}
function computeInternalBonusForMonth(monthStr){
  const range = monthRange(monthStr);
  if(!range) return [];
  const groups = buildMonthlyProjectClientDayTotals(monthStr);
  return Object.values(groups).map(g=>{
    const rate = state.internalFeeSetupRecords.find(r=>(r.projectCode||'')===g.projectCode && r.client===g.client);
    const roles = rolesForProjectClient(g.projectCode, g.client);
    const amounts = {};
    BONUS_ROLE_KEYS.forEach(k=>{
      const rateVal = rate ? (Number(rate[k])||0) : 0;
      amounts[k] = rateVal ? Math.round(rateVal/range.daysInMonth*g.totalDays) : 0;
    });
    return {projectCode:g.projectCode, client:g.client, totalDays:g.totalDays, roles, amounts};
  }).sort((a,b)=>(a.client||'').localeCompare(b.client||''));
}
function computeInternalBonusByPersonForMonth(monthStr){
  const rows = computeInternalBonusForMonth(monthStr);
  const personTotals = {};
  rows.forEach(r=>{
    BONUS_ROLE_KEYS.forEach((k,i)=>{
      const name = r.roles[k];
      const amt = r.amounts[k];
      if(!name || !amt) return;
      if(!personTotals[name]) personTotals[name] = {name, total:0, breakdown:[]};
      personTotals[name].total += amt;
      personTotals[name].breakdown.push({client:r.client, projectCode:r.projectCode, role:BONUS_ROLE_LABELS[i], amount:amt});
    });
  });
  return Object.values(personTotals).sort((a,b)=>b.total-a.total);
}
function computeClientBillingForMonth(monthStr){
  const range = monthRange(monthStr);
  if(!range) return [];
  const groups = buildMonthlyProjectClientDayTotals(monthStr);
  const feeKeys = ['monthlyProcessingFee','monthlyServiceFee','monthlyDormFee','monthlyDormManageFee'];
  const dormFeeKeys = ['monthlyDormFee','monthlyDormManageFee'];
  return Object.values(groups).map(g=>{
    const rate = state.clientFeeSetupRecords.find(r=>(r.projectCode||'')===g.projectCode && r.client===g.client);
    const billDorm = !rate || rate.billDormFee !== '否';
    const amounts = {}; let total = 0;
    feeKeys.forEach(k=>{
      if(!billDorm && dormFeeKeys.includes(k)){ amounts[k] = 0; return; }
      const rateVal = rate ? (Number(rate[k])||0) : 0;
      const amt = rateVal ? Math.round(rateVal/range.daysInMonth*g.totalDays) : 0;
      amounts[k] = amt; total += amt;
    });
    return {projectCode:g.projectCode, client:g.client, totalDays:g.totalDays, amounts, total};
  }).sort((a,b)=>(a.client||'').localeCompare(b.client||''));
}
function downloadCalcReportCSV(header, rows, filenamePrefix, monthStr){
  const csv = [header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${monthStr}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function base64ToBlob(base64, mimeType){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
  const byteArray = new Uint8Array(byteNumbers);
  return new Blob([byteArray], {type: mimeType});
}

/* =========================================================
   CSV export / import (學生資料)
========================================================= */
function csvEscape(val){
  const str = (val===undefined||val===null) ? '' : String(val);
  if(/[",\r\n]/.test(str)) return '"' + str.replace(/"/g,'""') + '"';
  return str;
}
function exportStudentsCSV(){
  const header = STUDENT_FIELDS.map(f=>f.label);
  const rows = state.students.map(s => STUDENT_FIELDS.map(f => csvEscape(s[f.key])));
  const csv = [header, ...rows].map(r=>r.join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `學生資料_${ts}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseCSV(text){
  const rows = []; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===',') { row.push(field); field=''; }
      else if(c==='\r') { /* skip */ }
      else if(c==='\n') { row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0]===''));
}

function exportEntityCSV(list, fields, filenamePrefix, extraColumns){
  const header = fields.map(f=>f.label).concat((extraColumns||[]).map(e=>e.label));
  const rows = list.map(item=>{
    const core = fields.map(f=>csvEscape(item[f.key]));
    const extra = (extraColumns||[]).map(e=>csvEscape(e.compute(item)));
    return core.concat(extra);
  });
  const csv = [header, ...rows].map(r=>r.join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `${filenamePrefix}_${ts}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseImportRows(text, fields, fkValidators){
  const rows = parseCSV(text);
  if(rows.length < 2) return {error:'檔案沒有可匯入的資料列。'};
  const header = rows[0].map(h=>h.trim());
  const labelToKey = {};
  fields.forEach(f=>{ labelToKey[f.label] = f.key; });
  const imported = [];
  let skipped = 0;
  rows.slice(1).forEach(r=>{
    if(r.every(c=>c.trim()==='')) return;
    const obj = {};
    header.forEach((h,idx)=>{
      const key = labelToKey[h];
      if(key) obj[key] = (r[idx]!==undefined) ? r[idx] : '';
    });
    let valid = true;
    if(fkValidators){
      for(const fk of fkValidators){
        const v = (obj[fk.key]||'').trim();
        if(!v || !fk.validate(v)){ valid = false; break; }
      }
    }
    if(!valid){ skipped++; return; }
    imported.push(obj);
  });
  return {imported, skipped};
}

async function handleImportGenericFile(file, opts){
  let text;
  try{ text = await file.text(); } catch(e){ alert('無法讀取檔案。'); return; }
  const result = parseImportRows(text, opts.fields, opts.fkValidators);
  if(result.error){ alert(result.error); return; }
  if(!result.imported.length){
    alert('沒有任何一列可以匯入，請確認欄位格式與必填的關聯 ID 是否正確。請使用「下載完整資料」產生的檔案來編輯，不要自己重新排欄位。');
    return;
  }
  const ok = confirm(`即將以檔案中的 ${result.imported.length} 筆資料，完全覆蓋目前系統中的 ${opts.currentCount} 筆${opts.entityLabel}。\n\n此動作無法復原，確定要繼續嗎？`);
  if(!ok) return;
  try{
    await gsRun(opts.importFnName, authToken, result.imported);
    await loadAll();
    alert(`匯入完成，${opts.entityLabel}已覆蓋為 ${result.imported.length} 筆${result.skipped?`（另有 ${result.skipped} 筆因欄位或關聯 ID 不符被略過）`:''}。`);
  }catch(err){
    alert('匯入失敗：' + errMsg(err));
  }
}
function wireGenericImportExport(prefix, exportFn, importOpts){
  const exportBtn = document.getElementById(prefix+'-export-btn');

async function handleImportStudentsFile(file){
  let text;
  try{ text = await file.text(); } catch(e){ alert('無法讀取檔案。'); return; }
  const rows = parseCSV(text);
  if(rows.length < 2){ alert('檔案沒有可匯入的資料列。'); return; }
  const header = rows[0].map(h=>h.trim());
  const labelToKey = {}; STUDENT_FIELDS.forEach(f=>{ labelToKey[f.label]=f.key; });
  const imported = []; let skipped = 0;
  rows.slice(1).forEach(r=>{
    if(r.every(c=>c.trim()==='')) return;
    const obj = {};
    header.forEach((h,idx)=>{ const key=labelToKey[h]; if(key) obj[key]=(r[idx]!==undefined)?r[idx]:''; });
    if(!obj.originalName && !obj.chineseName){ skipped++; return; }
    STUDENT_FIELDS.forEach(f=>{ if(obj[f.key]===undefined) obj[f.key]=''; });
    if(!obj.status) obj.status = STUDENT_STATUS[0];
    if(!obj.extensionProof) obj.extensionProof='未收到';
    if(!obj.nightInternshipDoc) obj.nightInternshipDoc='未收到';
    imported.push(obj);
  });
  if(!imported.length){ alert('沒有任何一列符合匯入格式（每一列至少需要填寫「原始姓名」或「中文姓名」）。'); return; }
  const ok = confirm(`即將以檔案中的 ${imported.length} 筆資料，完全覆蓋目前系統中的 ${state.students.length} 筆學生資料。\n\n此動作無法復原，確定要繼續嗎？`);
  if(!ok) return;
  try{
    await gsRun('importStudentsOverwrite', authToken, imported);
    await loadAll();
    alert(`匯入完成，學生資料已覆蓋為 ${imported.length} 筆${skipped?`（另有 ${skipped} 筆因缺少姓名被略過）`:''}。`);
  }catch(err){
    alert('匯入失敗：' + errMsg(err));
  }
}

      ...personCsvRows
    ];
    downloadCalcReportCSV(combinedHeader, combinedRows, '內部獎金計算', bonusCalcMonth);
  });

  // Client billing calculation (auto-computed report)
  const billingMonthInput = document.getElementById('billing-month');
  if(billingMonthInput){
    billingMonthInput.addEventListener('change', ()=>{
      clientBillingCalcMonth = billingMonthInput.value || currentMonthStr();
      render();
    });
  }
  wireSearchInput('billing-search', v=>{ clientBillingSearchQuery = v; });
  const downloadBillingBtn = document.getElementById('btn-download-billing');
  if(downloadBillingBtn) downloadBillingBtn.addEventListener('click', ()=>{
    const rows = computeClientBillingForMonth(clientBillingCalcMonth);
    const header = ['專案編號','客戶名稱','每月辦件費','每月服務費','每月宿舍費','每月宿管費','總計金額','當月在台天數'];
    const csvRows = rows.map(r=>[r.projectCode, r.client, r.amounts.monthlyProcessingFee, r.amounts.monthlyServiceFee, r.amounts.monthlyDormFee, r.amounts.monthlyDormManageFee, r.total, r.totalDays]);
    downloadCalcReportCSV(header, csvRows, '客戶請款計算', clientBillingCalcMonth);
  });
  document.querySelectorAll('[data-download-invoice]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const projectCode = b.dataset.project || '';
      const client = b.dataset.client || '';
      const originalText = b.textContent;
      b.disabled = true; b.textContent = '產生中…';
      try{
        const result = await gsRun('generateClientInvoice', authToken, projectCode, client, clientBillingCalcMonth);
        const blob = base64ToBlob(result.base64, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = result.filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }catch(err){
        alert('產生請款單失敗：' + errMsg(err));
      }finally{
        b.disabled = false; b.textContent = originalText;
      }
    });
  });

  // Client fee setup
  const addCfeeBtn = document.getElementById('btn-add-cfee');
  if(addCfeeBtn) addCfeeBtn.addEventListener('click', ()=>{
    openModal(clientFeeSetupFormModal(null));
    document.getElementById('cfee-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target; setFormBusy(form, true);
      try{ await gsRun('addClientFeeSetup', authToken, formToObject(form)); closeModal(); await loadAll(); }
      catch(err){ setFormBusy(form,false); alert(errMsg(err)); }
    });
  });
  document.querySelectorAll('[data-edit-cfee]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.clientFeeSetupRecords.find(x=>x.id===b.dataset.editCfee);
      openModal(clientFeeSetupFormModal(item));
      document.getElementById('cfee-form').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const form = e.target; setFormBusy(form, true);
        try{ await gsRun('updateClientFeeSetup', authToken, item.id, formToObject(form)); closeModal(); await loadAll(); }
        catch(err){ setFormBusy(form,false); alert(errMsg(err)); }
      });
    });
  });
  document.querySelectorAll('[data-del-cfee]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('確定要刪除這筆客戶費用設定嗎？')) return;
      try{ await gsRun('deleteClientFeeSetup', authToken, b.dataset.delCfee); await loadAll(); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  wireSearchInput('cfee-search', v=>{ clientFeeSetupSearchQuery = v; });
  wireGenericImportExport('cfee',
    ()=>exportEntityCSV(state.clientFeeSetupRecords, CLIENT_FEE_SETUP_FIELDS, '客戶費用建檔'),
    {fields:CLIENT_FEE_SETUP_FIELDS, fkValidators:null, currentCount:state.clientFeeSetupRecords.length, entityLabel:'客戶費用設定', importFnName:'importClientFeeSetupOverwrite'}
  );

  // Internal fee setup
  const addIfeeBtn = document.getElementById('btn-add-ifee');
  if(addIfeeBtn) addIfeeBtn.addEventListener('click', ()=>{
    openModal(internalFeeSetupFormModal(null));
    document.getElementById('ifee-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target; setFormBusy(form, true);
      try{ await gsRun('addInternalFeeSetup', authToken, formToObject(form)); closeModal(); await loadAll(); }
      catch(err){ setFormBusy(form,false); alert(errMsg(err)); }
    });
  });
  document.querySelectorAll('[data-edit-ifee]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.internalFeeSetupRecords.find(x=>x.id===b.dataset.editIfee);
      openModal(internalFeeSetupFormModal(item));
      document.getElementById('ifee-form').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const form = e.target; setFormBusy(form, true);
        try{ await gsRun('updateInternalFeeSetup', authToken, item.id, formToObject(form)); closeModal(); await loadAll(); }
        catch(err){ setFormBusy(form,false); alert(errMsg(err)); }
      });
    });
  });
  document.querySelectorAll('[data-del-ifee]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('確定要刪除這筆內部費用設定嗎？')) return;
      try{ await gsRun('deleteInternalFeeSetup', authToken, b.dataset.delIfee); await loadAll(); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  wireSearchInput('ifee-search', v=>{ internalFeeSetupSearchQuery = v; });
  wireGenericImportExport('ifee',
    ()=>exportEntityCSV(state.internalFeeSetupRecords, INTERNAL_FEE_SETUP_FIELDS, '內部費用建檔'),
    {fields:INTERNAL_FEE_SETUP_FIELDS, fkValidators:null, currentCount:state.internalFeeSetupRecords.length, entityLabel:'內部費用設定', importFnName:'importInternalFeeSetupOverwrite'}
  );

  // Users
  wireSearchInput('user-search', v=>{ userSearchQuery = v; });
  const addUserBtn = document.getElementById('btn-add-user');
  if(addUserBtn) addUserBtn.addEventListener('click', ()=>{
    openModal(userFormModal(null));
    document.getElementById('user-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const data = formToObject(form);
      setFormBusy(form, true);
      try{ await gsRun('addUser', authToken, data); closeModal(); await loadAll(); }
      catch(err){ setFormBusy(form,false); showFormError('user-form-error', err); }
    });
  });
  document.querySelectorAll('[data-edit-user]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const u = state.users.find(x=>x.id===b.dataset.editUser);
      openModal(userFormModal(u));
      document.getElementById('user-form').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const form = e.target;
        const data = formToObject(form);
        setFormBusy(form, true);
        try{
          await gsRun('updateUser', authToken, u.id, data);
          closeModal(); await loadAll();
        }catch(err){ setFormBusy(form,false); showFormError('user-form-error', err); }
      });
    });
  });
  document.querySelectorAll('[data-del-user]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('確定要刪除這位使用者嗎？')) return;
      try{ await gsRun('deleteUser', authToken, b.dataset.delUser); await loadAll(); }
      catch(err){ alert(errMsg(err)); }
    });
  });
  document.querySelectorAll('[data-perm-module]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const moduleKey = b.dataset.permModule;
      const role = b.dataset.permRole;
      const nextLevel = PERMISSION_LEVEL_CYCLE[b.dataset.permLevel] || 'edit';
      b.disabled = true;
      try{
        await gsRun('updateRolePermission', authToken, moduleKey, role, nextLevel);
        if(!state.roleMatrix[moduleKey]) state.roleMatrix[moduleKey] = {};
        state.roleMatrix[moduleKey][role] = nextLevel;
        if(role === currentUser.role) permissions[moduleKey] = nextLevel;
        render();
      }catch(err){
        b.disabled = false;
        alert('更新權限失敗：' + errMsg(err));
      }
    });
  });
}

/* =========================================================
   Init
========================================================= */
bootAuth();
</script>
</body>
</html>
